name: Python test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install requirements
        # CPU torch instead of the cu126 wheel pinned in requirements.txt.
        run: |
          pip install --upgrade pip
          pip install torch==2.13.0 torchvision --index-url https://download.pytorch.org/whl/cpu
          grep -v -e '^torch==' -e '^--extra-index-url' requirements.txt > requirements-cpu.txt
          pip install -r requirements-cpu.txt
          pip install --no-deps "k-diffusion @ git+https://github.com/crowsonkb/k-diffusion.git@4601bf085320592473f681a62808ed873d17fad5" dctorch==0.1.2
      - name: Test with Unittest
        run: python -m unittest discover --verbose -s tests -p '*_test.py'
